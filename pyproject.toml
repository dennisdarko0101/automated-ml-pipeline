[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automated-ml-pipeline"
version = "1.0.0"
description = "Production AutoML system: data ingestion, feature engineering, model training, evaluation, and deployment"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "AutoML Team" }]

dependencies = [
    "prefect>=3.0,<4.0",
    "mlflow>=2.10,<3.0",
    "scikit-learn>=1.4,<2.0",
    "xgboost>=2.0,<3.0",
    "lightgbm>=4.0,<5.0",
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<2.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic-settings>=2.1,<3.0",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.0,<25.0",
    "httpx>=0.27,<1.0",
    "prometheus-client>=0.20,<1.0",
    "boto3>=1.34,<2.0",
    "joblib>=1.3,<2.0",
    "pyyaml>=6.0,<7.0",
    "great-expectations>=0.18,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.3,<1.0",
    "mypy>=1.8,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[project.scripts]
automl = "src.api.main:start"
